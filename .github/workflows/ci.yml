name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-groups
      - run: uv run --locked python -m ruff check .
      - run: uv run --locked python -m ruff format --check .
      - run: uv run --locked python -m unittest discover -q
        env:
          PYTHONPATH: src
      - run: node --test tests/js/browser.test.cjs tests/js/connection.test.cjs tests/js/markdown.test.cjs tests/js/sentinel.test.cjs
      - run: uv run --locked python -m build
      - run: uv run --locked python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.node }}
          path: dist/
  providers-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build src/providers --out-dir "$RUNNER_TEMP/provider-dist"
      - run: uv venv "$RUNNER_TEMP/provider-venv" --python "${{ matrix.python }}"
      - run: uv pip install --python "$RUNNER_TEMP/provider-venv/bin/python" "$RUNNER_TEMP/provider-dist"/*.whl
      - run: "$RUNNER_TEMP/provider-venv/bin/python" -m unittest discover -s src/providers/tests -p test_api.py -v
      - run: "$RUNNER_TEMP/provider-venv/bin/python" tests/provider_package_smoke.py
      - run: uv venv "$RUNNER_TEMP/provider-sdist-venv" --python "${{ matrix.python }}"
      - run: uv pip install --python "$RUNNER_TEMP/provider-sdist-venv/bin/python" "$RUNNER_TEMP/provider-dist"/*.tar.gz
      - run: "$RUNNER_TEMP/provider-sdist-venv/bin/python" -m unittest discover -s src/providers/tests -p test_api.py -v
      - run: "$RUNNER_TEMP/provider-sdist-venv/bin/python" tests/provider_package_smoke.py
  latest-dependencies:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv lock --upgrade
      - run: uv sync --locked --all-groups
      - run: uv run --locked python -m ruff check .
      - run: uv run --locked python -m unittest discover -q
        env:
          PYTHONPATH: src
      - run: node --test tests/js/browser.test.cjs tests/js/connection.test.cjs tests/js/markdown.test.cjs tests/js/sentinel.test.cjs
