[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siopechat"
version = "1.2b0"
description = "Provider-oriented terminal workspace for AI web sessions"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "TahsinCr"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.27,<1",
    "browser-cookie3>=0.20.1,<0.21",
    "lz4>=4.4.5,<5",
    "curl-cffi>=0.16,<1",
    "backports.strenum>=1.3.1,<2; python_version < '3.11'",
    "exceptiongroup>=1.3.1,<2; python_version < '3.11'",
    "prompt-toolkit>=3.0,<4",
    "rich>=13,<15",
    "gemini-webapi>=2.1.1,<2.2; python_version >= '3.11'",
]

[project.scripts]
siopechat = "bootstrap:main"

[dependency-groups]
dev = ["build>=1,<2", "ruff>=0.11,<1", "twine>=6,<7"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".serena", "src/utils/container", "src/utils/events", "src/utils/compatibility.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
package-dir = {"" = "src", "extensions" = "extensions", "themes" = "themes"}
py-modules = ["downloads", "views", "accounts", "bootstrap", "settings", "actions", "tasks", "runtime", "extension", "backend", "language", "theme"]
packages = ["cli", "providers", "providers.chatgpt", "providers.gemini", "providers.claude", "utils", "utils.container", "utils.events", "lang", "extensions", "extensions.layout", "extensions.archive", "themes"]

[tool.setuptools.package-data]
"providers" = ["scripts/*.cjs"]
"providers.chatgpt" = ["scripts/*.cjs", "scripts/browser/*.cjs", "scripts/sentinel/*.cjs"]
"lang" = ["*.json"]
"extensions.layout" = ["languages/*.json", "manifest.json"]
"extensions.archive" = ["manifest.json"]
"themes" = ["*.json"]
"utils" = ["LICENSE", "NOTICE"]
