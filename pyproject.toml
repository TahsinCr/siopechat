[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siopechat"
version = "1.5.4b0"
description = "Provider-oriented terminal workspace for AI web sessions"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [{name = "TahsinCr"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "exceptiongroup>=1.2,<2; python_version < '3.11'",
    "httpx>=0.27,<1",
    "websocket-client>=1.8,<2",
    "browser-cookie3>=0.20.1,<0.21",
    "lz4>=4.4.5,<5",
    "curl-cffi>=0.16,<1",
    "flowevent>=1.3,<2",
    "prompt-toolkit>=3.0,<4",
    "rich>=13,<15",
]

[project.scripts]
siopechat = "bootstrap:main"

[dependency-groups]
dev = ["build>=1,<2", "ruff>=0.11,<1", "twine>=6,<7"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".serena"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
package-dir = {"" = "src", "extensions" = "extensions"}
py-modules = [
    "downloads",
    "bootstrap",
    "cli",
    "settings",
    "actions",
    "tasks",
    "runtime",
    "extension",
    "backend",
    "language",
]
# Resource-only namespace packages are listed explicitly so setuptools includes
# their bundled helpers and translations without package-discovery ambiguity.
packages = [
    "accounts",
    "tui",
    "providers",
    "providers.chatgpt",
    "providers.chatgpt.sentinel",
    "providers.gemini",
    "providers.claude",
    "providers.grok",
    "utils",
    "lang",
    "extensions",
    "extensions.layout",
    "extensions.layout.languages",
    "extensions.archive",
]

[tool.setuptools.package-data]
"lang" = ["*.json"]
"extensions.layout" = ["languages/*.json", "manifest.json"]
"extensions.archive" = ["manifest.json"]
