[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siopechat-providers"
version = "1.5.1b0"
description = "Independent Python clients for ChatGPT, Gemini and Claude web accounts"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "TahsinCr"}]
dependencies = [
    "httpx>=0.27,<1",
    "browser-cookie3>=0.20.1,<0.21",
    "lz4>=4.4.5,<5",
    "curl-cffi>=0.16,<1",
]

[tool.setuptools]
package-dir = {"providers" = "."}
packages = ["providers", "providers.chatgpt", "providers.gemini", "providers.claude"]

[tool.setuptools.package-data]
"providers" = ["scripts/*.cjs"]
"providers.chatgpt" = ["scripts/*.cjs", "scripts/browser/*.cjs", "scripts/sentinel/*.cjs"]
